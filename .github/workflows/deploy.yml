name: Deploy feed
on:
  push:
    branches: [main]
    paths: ["feed/index.html", "feed/worker/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency: deploy-feed
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara la config (id D1 dai secrets)
        run: |
          cp feed/index.html feed/worker/src/index.html
          sed "s/REPLACE_WITH_D1_ID/${{ secrets.FEED_D1_ID }}/" feed/worker/wrangler.toml > feed/worker/wrangler.local.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: feed/worker
          command: deploy -c wrangler.local.toml
