<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Learn Feed</title>
<style>
:root{--bg:#0f1f1a;--fg:#f4f1ea;--acc:#f0a45d}*{box-sizing:border-box;margin:0}
body{background:#000;color:var(--fg);font:15px system-ui;overscroll-behavior:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:max(10px,env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#000a,#0000);display:flex;gap:8px;overflow-x:auto}
header button{background:#ffffff22;color:var(--fg);border:0;border-radius:99px;padding:6px 12px;white-space:nowrap;font:inherit}
header button.on{background:var(--acc);color:#111}
main{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
section{height:100dvh;scroll-snap-align:start;position:relative;background:var(--bg)}
video{width:100%;height:100%;object-fit:contain;background:#000}
.cap{position:absolute;left:14px;right:70px;bottom:max(22px,env(safe-area-inset-bottom));pointer-events:none;text-shadow:0 1px 6px #000}
.chip{display:inline-block;background:var(--acc);color:#111;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin-bottom:6px}
.cap h2{font-size:22px;line-height:1.15}.cap p{opacity:.8;font-size:13px;margin-top:4px}
.side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px}
.side button{width:48px;height:48px;border-radius:50%;border:0;background:#ffffff26;color:var(--fg);font-size:12px}
.side button.on{background:var(--acc);color:#111}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:70dvh;background:#14211c;border-radius:16px 16px 0 0;z-index:9;display:none;flex-direction:column;padding:12px 14px max(12px,env(safe-area-inset-bottom))}
.sheet.on{display:flex}.sheet .list{overflow:auto;flex:1;margin:8px 0}.sheet .c{padding:6px 0;border-bottom:1px solid #ffffff18;font-size:14px}
.sheet .c small{opacity:.6;display:block}.sheet .c .r{background:#ffffff14;border-radius:8px;padding:6px 8px;margin-top:4px}
.sheet textarea{width:100%;background:#ffffff14;color:var(--fg);border:0;border-radius:8px;padding:8px;font:inherit;resize:none}
.sheet .row{display:flex;gap:8px;margin-top:8px;align-items:center}.sheet select,.sheet button{background:#ffffff22;color:var(--fg);border:0;border-radius:8px;padding:8px 10px;font:inherit}
.sheet .send{background:var(--acc);color:#111;margin-left:auto}
</style>
<div class=sheet id=sh><b id=sht></b><div class=list id=shl></div><textarea id=shx rows=2 placeholder="Scrivi un commento…"></textarea>
<div class=row><select id=sht2><option value="">Nessun tag</option><option value=claude>@claude</option><option value=codex>@codex</option><option value=both>@claude + @codex</option></select><button onclick="sh.classList.remove('on')">Chiudi</button><button class=send id=shs>Invia</button></div></div>
<header><button id=o></button><span id=f style=display:contents></span></header><main id=m></main>
<script>
const S=k=>{try{return JSON.parse(localStorage[k]||'null')}catch{return null}};
let social={likes:new Set(),comments:{}};const api=(p,b)=>fetch(p,b?{method:'POST',body:JSON.stringify(b)}:{}).then(r=>r.json());
let order=(S('order')||'logico'),all=[],saved=new Set(S('saved')||[]),exam='Tutti',speed=1;
// Picture-in-Picture automatico quando esci dalla finestra/tab
let playing=null;
const enterPiP=()=>{if(playing&&!playing.paused&&document.pictureInPictureElement!==playing&&document.pictureInPictureEnabled)playing.requestPictureInPicture().catch(()=>{})};
try{navigator.mediaSession.setActionHandler('enterpictureinpicture',enterPiP)}catch{}
document.addEventListener('visibilitychange',()=>{if(document.hidden)enterPiP();else if(document.pictureInPictureElement)document.exitPictureInPicture().catch(()=>{})});
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');
 if(e.isIntersecting){if(!v.src)v.src=v.dataset.s;v.autoPictureInPicture=true;playing=v;v.playbackRate=speed;v.play().catch(()=>{})}else{v.pause()}}),{threshold:.7});
function render(){m.innerHTML='';io.disconnect();
 const key=v=>{const l=/lezione (\d+)/i.exec(v.topic+' '+(v.parent||'')),p=/ p\. (\d+)/.exec(v.topic);return [l?+l[1]:999,p?+p[1]:0,v.level||0,v.topic]};
 const cmp=(a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]||x[3].localeCompare(y[3])};
 const src=order==='shuffle'?[...all].sort(()=>Math.random()-.5):[...all].sort(cmp);
 const list=src.filter(v=>exam==='Tutti'?true:exam==='Salvati'?saved.has(v.id):v.exam===exam);
 for(const v of list){const s=document.createElement('section');
  s.innerHTML=`<video playsinline loop preload="none" data-s="/video/${v.id}"></video>
  <div class=cap><span class=chip>${v.exam}</span><h2>${v.topic}</h2><p>${v.parent?v.parent+' · ':''}${v.level?'livello '+v.level:''}</p></div>
  <div class=side><button class="${social.likes.has(v.id)?'on':''}" data-a=like>♥</button><button data-a=cm>💬<br>${social.comments[v.id]||''}</button><button class="${saved.has(v.id)?'on':''}" data-a=save>★<br>Salva</button><button data-a=speed>${speed}×</button></div>`;
  const vid=s.querySelector('video');vid.onclick=()=>vid.paused?vid.play():vid.pause();
  s.querySelector('[data-a=save]').onclick=e=>{saved.has(v.id)?saved.delete(v.id):saved.add(v.id);localStorage.saved=JSON.stringify([...saved]);e.currentTarget.classList.toggle('on')};
  s.querySelector('[data-a=speed]').onclick=()=>{speed=speed>=2?1:speed+.5;document.querySelectorAll('video').forEach(x=>x.playbackRate=speed);document.querySelectorAll('[data-a=speed]').forEach(b=>b.textContent=speed+'×')};
  s.querySelector('[data-a=like]').onclick=async e=>{const r=await api('/api/like',{id:v.id});r.liked?social.likes.add(v.id):social.likes.delete(v.id);e.currentTarget.classList.toggle('on',r.liked)};
  s.querySelector('[data-a=cm]').onclick=()=>openSheet(v);
  m.append(s);io.observe(s)}
 if(!list.length)m.innerHTML='<section style="display:grid;place-items:center">Nessun video</section>'}
let cur=null;
async function loadC(){const cs=await api('/api/comments?video='+cur.id);shl.innerHTML=cs.map(c=>`<div class=c><small>${c.created_at}${c.target?' · @'+c.target+' ('+c.status+')':''}</small>${c.text.replace(/</g,'&lt;')}${c.reply?'<div class=r>↳ '+c.reply.replace(/</g,'&lt;')+'</div>':''}</div>`).join('')||'<div class=c>Nessun commento</div>'}
function openSheet(v){cur=v;sht.textContent=v.topic;sh.classList.add('on');loadC()}
shs.onclick=async()=>{const t=shx.value.trim();if(!t)return;await api('/api/comment',{id:cur.id,text:t,target:sht2.value||null});shx.value='';social.comments[cur.id]=(social.comments[cur.id]||0)+1;loadC()};
const lab=()=>o.textContent=order==='shuffle'?'🔀 Shuffle':'↧ Ordine lezioni';
o.onclick=()=>{order=order==='shuffle'?'logico':'shuffle';localStorage.order=JSON.stringify(order);lab();render()};lab();
Promise.all([fetch('/api/videos').then(r=>r.json()),api('/api/social').catch(()=>({likes:[],comments:{}}))]).then(([d,sc])=>{social.likes=new Set(sc.likes);social.comments=sc.comments;all=d;
 const ex=[...new Set(d.map(v=>v.exam))].sort((a,b)=>(/Morpurgo/.test(b)-/Morpurgo/.test(a))||a.localeCompare(b));const exams=[...ex,'Salvati','Tutti'];exam=ex[0]||'Tutti';
 f.innerHTML=exams.map(e=>`<button class="${e===exam?'on':''}">${e}</button>`).join('');
 f.querySelectorAll('button').forEach(b=>b.onclick=()=>{exam=b.textContent;f.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()});render()});
</script></html>
